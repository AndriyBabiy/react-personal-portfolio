name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/andriybabiy/react-personal-portfolio

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          FULL_IMAGE: ghcr.io/andriybabiy/react-personal-portfolio
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$FULL_IMAGE:latest" -t "$FULL_IMAGE:$SHA" .
          docker push "$FULL_IMAGE" --all-tags

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "\
            set -euo pipefail; \
            mkdir -p ~/portfolio; \
            cat > ~/portfolio/docker-compose.yml <<'INNEREOF'
          services:
            portfolio:
              image: ghcr.io/andriybabiy/react-personal-portfolio:latest
              ports:
                - \"127.0.0.1:8090:80\"
              restart: always
          INNEREOF
            sudo docker pull ghcr.io/andriybabiy/react-personal-portfolio:latest; \
            cd ~/portfolio; \
            sudo docker compose down || true; \
            sudo docker compose up -d; \
          "

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sleep 5
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" 'curl -sf http://127.0.0.1:8090/ | head -1' || exit 1
          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" 'curl -sf http://127.0.0.1:8090/desktop | head -1' || exit 1
          echo "Deployment successful!"
