server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must never be heuristically cached, so new asset hashes propagate immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Same rule for the Sveltia CMS shell
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Hashed assets are content-addressed → safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|pdf|mp4|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
